version: 2

sources:
  - name: dataraw
    schema: mydataset
    tables:
      - name: product
        identifier: raw_gz_product
        description: Type de produits
        columns:
          - name: product_id
            description: identifiant produit (Primary Key)
            tests:
              - unique
              - not_null
          - name: purchase_price
            description: Prix d'achat
            tests:
              - unique
              - not_null
      - name: sales
        identifier: raw_gz_sales
        description: Nombre de ventes
        columns:
          - name: date_date
            description: Date
            tests:
              - unique
              - not_null
          - name: order_id
            description: Primary key to ship
            tests:
              - unique
              - not_null
          - name: product_id
            description: identifiant produit(foreign key)
            tests:
              - unique
              - not_null
          - name: revenue
            description: Recettes
            tests:
              - unique
              - not_null
          - name: quantity
            description: Quantité
            tests:
              - unique
              - not_null
      - name: ship
        identifier: raw_gz_ship
        description: Transport
        columns:
          - name: order_id
            description: Numéro de commande (Primary key)
            tests:
              - unique
              - not_null
          - name: shipping_fee,
            description: Coût d'expédition
            tests:
              - unique
              - not_null
          - name: logcost,
            description: Coût logistique
            tests:
              - unique
              - not_null
          - name: ship_cost
            description: Coût du navire
            tests:
              - unique
              - not_null
